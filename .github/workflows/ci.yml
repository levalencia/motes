name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Run unit tests
        run: uv run pytest -m unit --tb=short -q
        env:
          MOTES_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          MOTES_SECRET_KEY: "ci-test-key-not-real"

  frontend-check:
    name: Frontend Check (svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Svelte check
        run: npx svelte-check --fail-on-warnings=false --threshold error
      - name: Vitest
        run: npx vitest run
      - name: Build
        run: npm run build

  ios-test:
    name: iOS Unit Tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: MotesiOS/MotesiOS
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # iOS 26 / Xcode 26 required. Update path when available on GitHub runners.
        # macos-15 ships Xcode 16.x; full build needs Xcode 26 beta.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build & Test
        run: |
          xcodebuild test \
            -project MotesiOS.xcodeproj \
            -scheme MotesiOS \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:MotesiOSTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true
        # NOTE: Tests may fail on CI until Xcode 26 runners are available.
        # The `|| true` prevents blocking the pipeline until then.
